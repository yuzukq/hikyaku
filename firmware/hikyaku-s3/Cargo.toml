[package]
edition      = "2024"
name         = "hikyaku-s3"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "hikyaku-s3"
path = "./src/bin/main.rs"

[features]
# ログの出し先。既定は UART0（GPIO43 → CH9102F）。
default = ["log-uart"]
log-uart = ["esp-println/uart"]
# 診断用: ログを S3 の USB-C（USB シリアル/JTAG）から PC に出す。CH9102F が使えないときに、S3 を PC に直接つないでログを見る。
# USB-C を PC に使うので、キーボード用の USB ホストは動かさない（7skb は使えない）。
# `--no-default-features` が必要（`tools/hk` は FEATURES に usb-log があれば自動で付ける）。
usb-log = ["esp-println/jtag-serial"]
# 試験用: PC のキーボードの入力を USB シリアルで受け取り、USB キーボードの代わりに使う（PC 側は `hid-probe evbridge`）。
serial-bridge = ["usb-log"]
selftest = []
# USB キーボードのレポート（修飾キー・キーコード）を 1 つずつログに出す。OTA の組み合わせキーが検出されないときの切り分け用。
usb-trace = []
# トラックパッド（SPI）。コネクタが届くまで既定では無効。
trackpad = ["dep:hikyaku-pinnacle", "dep:hikyaku-pointer", "dep:embedded-hal-bus"]
# 生データ（`rel <ms> raw=[b0, b1, b2] dx= dy=`）をログに出す。
# ホストで再生できる（`cargo run -p hikyaku-pointer --example replay_rel -- <log>`。tools/traces/README.md）。
trackpad-trace = ["trackpad"]
# 静止中のぶれ（指を置いたままでの ±1〜2 の揺れ）を抑えるフィルタ（hikyaku_pointer::relative::StillFilter）。
# 動き始めの反応は鈍らせない（1 パケットで大きく動いたときはそのまま通す）。既定は無効。
trackpad-still-filter = ["trackpad"]
# パッド側のタップを切り、ソフト側でタップを判定する（hikyaku_pointer::relative::SoftTap）。スワイプ中の誤クリック対策。
# 指を離した合図に ZIdle = 5（QMK と同じ）を使う。既定は無効（パッド側のタップ）。
trackpad-soft-tap = ["trackpad"]
# タッチ感度（ADC 減衰）。既定は 2X（4X では指の検出が途切れた。2026-10-15）。1X がいちばん敏感、4X がいちばん鈍い（QMK の既定）。
# 1 つだけ付ける（複数付けるとコンパイルエラー）。`trackpad-sens-2x` は既定と同じ（以前のコマンドがそのまま使えるように残している）。
trackpad-sens-1x = ["trackpad"]
trackpad-sens-2x = ["trackpad"]
trackpad-sens-3x = ["trackpad"]
trackpad-sens-4x = ["trackpad"]
# 診断: 起動時に、SPI を使う前の DR・MISO のピンの状態（プルアップ／プルダウンで読んだ値）をログに出す。テスターなしで配線を切り分ける用。
trackpad-probe = ["trackpad"]
# 起動時に SPI の読み書きの総当たりテスト（モード × 周波数 × CS 待ち）を行い、結果をログに出す。
trackpad-selftest = ["trackpad"]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "colors", "critical-section"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
] }
trouble-host = { version = "0.7.0", features = ["gatt", "security", "log", "serde"] }
embassy-futures = "0.1"
embedded-hal-bus = { version = "0.3", optional = true }
hikyaku-hid = { path = "../../crates/hikyaku-hid" }
hikyaku-pinnacle = { path = "../../crates/hikyaku-pinnacle", optional = true }
hikyaku-pointer = { path = "../../crates/hikyaku-pointer", optional = true }
sha2 = { version = "0.11", default-features = false }
esp-storage = { version = "0.10", features = ["esp32s3", "embedded-storage"] }
postcard = { version = "1.1", default-features = false }
embassy-sync = "0.7"

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-usb-host = { version = "0.1", features = ["log"] }
embassy-usb-driver = "0.2"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[workspace]
